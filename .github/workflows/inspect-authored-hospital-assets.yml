name: Inspect Authored Hospital Assets

on:
  push:
    branches:
      - agent/st-agnes-playable-apk
    paths:
      - '.github/workflows/inspect-authored-hospital-assets.yml'
      - 'gravenmere/deadwater/scripts/download-madduck-hospital.mjs'
      - 'gravenmere/deadwater/scripts/export-madduck-hospital.py'
  pull_request:
    branches:
      - agent/st-agnes-modular-hospital
    paths:
      - 'gravenmere/deadwater/scripts/download-madduck-hospital.mjs'
      - 'gravenmere/deadwater/scripts/export-madduck-hospital.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-hospital-assets:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gravenmere/deadwater

    steps:
      - name: Check out isolated St. Agnes branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser downloader
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Download creator-provided hospital source pack
        run: node scripts/download-madduck-hospital.mjs asset-inspection/madduck-downloads

      - name: Install Blender converter and headless graphics libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            blender \
            python3-numpy \
            xvfb \
            libegl1 \
            libgl1 \
            libglx0 \
            libopengl0 \
            libgl1-mesa-dri

      - name: Extract and inventory source files
        run: |
          mkdir -p asset-inspection/madduck-source asset-inspection/madduck-output
          unzip -q 'asset-inspection/madduck-downloads/blend_file+textures.zip' -d asset-inspection/madduck-source/blend
          find asset-inspection/madduck-source -type f -printf '%P\t%s bytes\n' | sort > asset-inspection/madduck-output/source-listing.txt
          cp asset-inspection/madduck-downloads/SOURCE.txt asset-inspection/madduck-output/SOURCE.txt
          BLEND_FILE="$(find asset-inspection/madduck-source/blend -type f -iname '*.blend' -print -quit)"
          test -n "$BLEND_FILE"
          printf '%s\n' "$BLEND_FILE" > asset-inspection/madduck-output/blend-path.txt

      - name: Export textured GLB and render asset sheets
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: |
          BLEND_FILE="$(cat asset-inspection/madduck-output/blend-path.txt)"
          xvfb-run -a blender --background "$BLEND_FILE" \
            --python-exit-code 1 \
            --python scripts/export-madduck-hospital.py \
            -- --output asset-inspection/madduck-output

      - name: Verify converted asset pack
        run: |
          test -s asset-inspection/madduck-output/madduck-hospital-assets.glb
          test -s asset-inspection/madduck-output/inventory.json
          test -s asset-inspection/madduck-output/asset-sheet-isometric.png
          test -s asset-inspection/madduck-output/asset-sheet-front.png
          test -s asset-inspection/madduck-output/asset-sheet-top.png

      - name: Upload asset inspection only
        uses: actions/upload-artifact@v4
        with:
          name: Authored-Hospital-Asset-Inspection
          path: gravenmere/deadwater/asset-inspection/madduck-output
          if-no-files-found: error
          retention-days: 14
