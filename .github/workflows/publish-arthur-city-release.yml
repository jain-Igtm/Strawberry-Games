name: Publish Arthur City browser download

on:
  push:
    branches:
      - agent/arthur-city-v01
    paths:
      - '.github/workflows/publish-arthur-city-release.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download validated Arthur City artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '9267677606'
        run: |
          curl -L --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/arthur-city.zip
          mkdir -p /tmp/arthur-city
          unzip -q /tmp/arthur-city.zip -d /tmp/arthur-city
          test -s /tmp/arthur-city/Arthur-City-Godot-debug.apk
          ls -lh /tmp/arthur-city/Arthur-City-Godot-debug.apk

      - name: Publish stable browser-download release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: arthur-city-test-01
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" /tmp/arthur-city/Arthur-City-Godot-debug.apk --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Arthur City Test 02" --notes "Rebuilt dense city pass from the isolated Arthur city branch."
          else
            gh release create "$TAG" /tmp/arthur-city/Arthur-City-Godot-debug.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target agent/arthur-city-v01 \
              --title "Arthur City Test 02" \
              --notes "Rebuilt dense city pass from the isolated Arthur city branch."
          fi
