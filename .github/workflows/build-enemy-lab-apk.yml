name: Build Arthur Enemy Lab APK

on:
  push:
    branches: ['lab/arthur-enemies-v011']
    paths:
      - 'godot-backrooms/**'
      - '.github/workflows/build-enemy-lab-apk.yml'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GODOT_VERSION: 4.7.1
      UPSTREAM_SHA: 6865f8b804f84441df8db3d0f3b6175a80195fd2
      KAYKIT_SHA: 96d5930a8dbdb363409bbc2d3341718b00e17c9c
      GODOT_DEMOS_SHA: 34fc99545fc41520a958248f607101e7d0b95b05
    steps:
      - name: Checkout enemy lab branch
        uses: actions/checkout@v4

      - name: Checkout pinned Godot Backrooms environment
        uses: actions/checkout@v4
        with:
          repository: zodiepupper/backrooms
          ref: 6865f8b804f84441df8db3d0f3b6175a80195fd2
          path: godot-build
          fetch-depth: 1

      - name: Checkout pinned CC0 furniture kit
        uses: actions/checkout@v4
        with:
          repository: KayKit-Game-Assets/KayKit-Furniture-Bits-1.0
          ref: 96d5930a8dbdb363409bbc2d3341718b00e17c9c
          path: kaykit-furniture
          fetch-depth: 1

      - name: Checkout pinned official Godot demo creature
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot-demo-projects
          ref: 34fc99545fc41520a958248f607101e7d0b95b05
          path: godot-demos
          fetch-depth: 1

      - name: Apply isolated enemy lab overlay
        run: |
          cp -a godot-backrooms/overlay/. godot-build/
          mkdir -p godot-build/arthur_assets/kaykit/gltf
          cp -a kaykit-furniture/addons/kaykit_furniture_bits/Assets/gltf/. godot-build/arthur_assets/kaykit/gltf/
          cp kaykit-furniture/addons/kaykit_furniture_bits/Assets/LICENSE.txt godot-build/arthur_assets/kaykit/LICENSE.txt
          mkdir -p godot-build/arthur_mobile/enemies/assets/godot_mob
          cp godot-demos/3d/squash_the_creeps/art/mob.glb godot-build/arthur_mobile/enemies/assets/godot_mob/mob.glb
          cp godot-demos/LICENSE.md godot-build/arthur_mobile/enemies/assets/godot_mob/LICENSE.md
          python3 - <<'PY'
          from pathlib import Path
          p = Path('godot-build/project.godot')
          text = p.read_text()
          text = text.replace('run/main_scene="res://arthur_mobile/main.tscn"', 'run/main_scene="res://arthur_mobile/enemies/enemy_lab.tscn"')
          text = text.replace('config/name="Arthur Backrooms"', 'config/name="Arthur Enemy Lab"')
          p.write_text(text)

          p = Path('godot-build/export_presets.cfg')
          text = p.read_text()
          text = text.replace('package/unique_name="com.strawberrygames.arthurbackroomsgodot"', 'package/unique_name="com.strawberrygames.arthurenemylab"')
          text = text.replace('package/name="Arthur Backrooms"', 'package/name="Arthur Enemy Lab"')
          text = text.replace('version/name="0.1.0"', 'version/name="enemy-lab-0.3"')
          p.write_text(text)
          PY
          mkdir -p godot-build/build

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android export requirements
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.1" "platforms;android-35"

      - name: Install Godot 4.7.1 and export templates
        run: |
          mkdir -p "$HOME/godot" "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          curl -L --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d "$HOME/godot"
          chmod +x "$HOME/godot/Godot_v4.7.1-stable_linux.x86_64"
          curl -L --retry 3 -o /tmp/templates.tpz "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz"
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.1.stable/"
          "$HOME/godot/Godot_v4.7.1-stable_linux.x86_64" --version

      - name: Create Android debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Arthur Enemy Lab,O=Strawberry Games,C=US"
          fi

      - name: Initialize Godot editor settings
        run: |
          GODOT="$HOME/godot/Godot_v4.7.1-stable_linux.x86_64"
          "$GODOT" --headless --editor --path godot-build --quit || true
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path.home()/'.config/godot/editor_settings-4.tres'
          p.parent.mkdir(parents=True, exist_ok=True)
          if not p.exists():
              p.write_text('[gd_resource type="EditorSettings" format=3]\n\n[resource]\n')
          text = p.read_text()
          settings = {
              'export/android/android_sdk_path': os.environ.get('ANDROID_HOME', os.environ.get('ANDROID_SDK_ROOT', '')),
              'export/android/java_sdk_path': os.environ['JAVA_HOME'],
              'export/android/debug_keystore': str(Path.home()/'.android/debug.keystore'),
          }
          for key, value in settings.items():
              line = f'{key} = "{value}"'
              pattern = rf'(?m)^{re.escape(key)}\s*=.*$'
              if re.search(pattern, text):
                  text = re.sub(pattern, line, text)
              else:
                  text += '\n' + line
          p.write_text(text)
          PY

      - name: Import and validate enemy lab
        run: |
          GODOT="$HOME/godot/Godot_v4.7.1-stable_linux.x86_64"
          "$GODOT" --headless --editor --path godot-build --quit
          "$GODOT" --headless --editor --path godot-build res://arthur_mobile/enemies/enemy_lab.tscn --quit

      - name: Export standalone Enemy Lab APK
        run: |
          GODOT="$HOME/godot/Godot_v4.7.1-stable_linux.x86_64"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          "$GODOT" --headless --path godot-build --export-debug "Android" "$GITHUB_WORKSPACE/godot-build/build/Arthur-Enemy-Lab.apk"
          test -f godot-build/build/Arthur-Enemy-Lab.apk
          ls -lh godot-build/build/Arthur-Enemy-Lab.apk

      - name: Upload Enemy Lab APK
        uses: actions/upload-artifact@v4
        with:
          name: Arthur-Enemy-Lab-apk
          path: godot-build/build/Arthur-Enemy-Lab.apk
          if-no-files-found: error
