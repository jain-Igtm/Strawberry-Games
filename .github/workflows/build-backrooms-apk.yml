name: Build Backrooms APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backrooms/**'
      - '.github/workflows/build-backrooms-apk.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backrooms
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web bundle
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Arthur-Backrooms-debug-apk
          path: backrooms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
