name: Build Godot Ashfall Deadwater APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'godot-ashfall-deadwater/**'
      - '.github/workflows/build-godot-ashfall-deadwater-apk.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Strawberry Games
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android export requirements
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.1" "platforms;android-35"

      - name: Install Godot 4.7.1 and export templates
        run: |
          mkdir -p "$HOME/godot" "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          curl -L --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d "$HOME/godot"
          chmod +x "$HOME/godot/Godot_v4.7.1-stable_linux.x86_64"
          curl -L --retry 3 -o /tmp/templates.tpz "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz"
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.1.stable/"
          "$HOME/godot/Godot_v4.7.1-stable_linux.x86_64" --version

      - name: Create Android debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Initialize Godot editor settings
        run: |
          GODOT="$HOME/godot/Godot_v4.7.1-stable_linux.x86_64"
          "$GODOT" --headless --editor --path godot-ashfall-deadwater --quit || true
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path.home()/'.config/godot/editor_settings-4.tres'
          p.parent.mkdir(parents=True, exist_ok=True)
          if not p.exists():
              p.write_text('[gd_resource type="EditorSettings" format=3]\n\n[resource]\n')
          text = p.read_text()
          settings = {
              'export/android/android_sdk_path': os.environ.get('ANDROID_HOME', os.environ.get('ANDROID_SDK_ROOT', '')),
              'export/android/java_sdk_path': os.environ['JAVA_HOME'],
              'export/android/debug_keystore': str(Path.home()/'.android/debug.keystore'),
          }
          for key, value in settings.items():
              line = f'{key} = "{value}"'
              pattern = rf'(?m)^{re.escape(key)}\s*=.*$'
              if re.search(pattern, text):
                  text = re.sub(pattern, line, text)
              else:
                  text += '\n' + line
          p.write_text(text)
          PY

      - name: Parse and import Ashfall
        run: |
          GODOT="$HOME/godot/Godot_v4.7.1-stable_linux.x86_64"
          "$GODOT" --headless --editor --path godot-ashfall-deadwater --quit

      - name: Smoke-run main scene
        run: |
          GODOT="$HOME/godot/Godot_v4.7.1-stable_linux.x86_64"
          timeout 12s "$GODOT" --headless --path godot-ashfall-deadwater --editor-pseudolocalization=false || code=$?
          if [ "${code:-0}" -ne 0 ] && [ "${code:-0}" -ne 124 ]; then exit "${code}"; fi

      - name: Exercise gameplay systems
        run: |
          set +e
          GODOT="$HOME/godot/Godot_v4.7.1-stable_linux.x86_64"
          timeout 20s "$GODOT" --headless --path godot-ashfall-deadwater --script res://ashfall/gameplay_smoke_test.gd 2>&1 | tee /tmp/ashfall-gameplay-smoke.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            detail=$(grep -E 'ASHFALL GAMEPLAY SMOKE FAILED|ASHFALL TEST:|SCRIPT ERROR|ERROR:' /tmp/ashfall-gameplay-smoke.log | tail -n 6 | tr '\n' ' ')
            if [ "$code" -eq 124 ]; then detail="Gameplay smoke timed out. Last output: $detail"; fi
            if [ -z "$detail" ]; then detail="Ashfall gameplay smoke failed with exit code $code"; fi
            echo "::error::$detail"
            exit "$code"
          fi

      - name: Export Android debug APK
        run: |
          GODOT="$HOME/godot/Godot_v4.7.1-stable_linux.x86_64"
          mkdir -p godot-ashfall-deadwater/build
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"
          "$GODOT" --headless --path godot-ashfall-deadwater --export-debug "Android" "$GITHUB_WORKSPACE/godot-ashfall-deadwater/build/Ashfall-Deadwater-Godot-debug.apk"
          test -f godot-ashfall-deadwater/build/Ashfall-Deadwater-Godot-debug.apk
          ls -lh godot-ashfall-deadwater/build/Ashfall-Deadwater-Godot-debug.apk

      - name: Upload Ashfall APK
        uses: actions/upload-artifact@v4
        with:
          name: Ashfall-Deadwater-Godot-debug-apk
          path: godot-ashfall-deadwater/build/Ashfall-Deadwater-Godot-debug.apk
          if-no-files-found: error
