name: Ashfall Raycaster Android

on:
  push:
    branches:
      - agent/ashfall-raycaster-mobile-spike
    paths:
      - 'gravenmere/deadwater-raycaster/**'
      - '.github/workflows/ashfall-raycaster-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gravenmere/deadwater-raycaster
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate static game
        run: |
          npm test
          npm run build
      - name: Install Android wrapper
        run: |
          npm install
          npx cap add android
          npx cap sync android
          node scripts/configure-android.mjs
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ashfall-raycaster-debug-apk
          path: gravenmere/deadwater-raycaster/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
