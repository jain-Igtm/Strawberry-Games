name: Build Alaska Explorer APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'alaska-explorer/**'
      - '.github/workflows/build-alaska-explorer-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'alaska-explorer/**'
      - '.github/workflows/build-alaska-explorer-apk.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      GODOT_VERSION: 4.7.1
      GODOT_STATUS: stable

    steps:
      - name: Checkout Strawberry Games
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android export requirements
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.1" "platforms;android-35"

      - name: Install Godot 4.7.1 and export templates
        run: |
          mkdir -p "$HOME/godot" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          curl -L --fail --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d "$HOME/godot"
          chmod +x "$HOME/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          curl -L --fail --retry 3 -o /tmp/templates.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/"
          "$HOME/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" --version

      - name: Create Android debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Strawberry Games,C=US"
          fi

      - name: Configure Godot Android paths
        run: |
          GODOT="$HOME/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          "$GODOT" --headless --editor --path alaska-explorer --quit || true
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          settings_file = Path.home() / '.config/godot/editor_settings-4.tres'
          settings_file.parent.mkdir(parents=True, exist_ok=True)
          if not settings_file.exists():
              settings_file.write_text('[gd_resource type="EditorSettings" format=3]\n\n[resource]\n')
          text = settings_file.read_text()
          values = {
              'export/android/android_sdk_path': os.environ.get('ANDROID_HOME', os.environ.get('ANDROID_SDK_ROOT', '')),
              'export/android/java_sdk_path': os.environ['JAVA_HOME'],
              'export/android/debug_keystore': str(Path.home() / '.android/debug.keystore'),
          }
          for key, value in values.items():
              line = f'{key} = "{value}"'
              pattern = rf'(?m)^{re.escape(key)}\s*=.*$'
              text = re.sub(pattern, line, text) if re.search(pattern, text) else text + '\n' + line
          settings_file.write_text(text)
          PY

      - name: Import and validate project
        run: |
          GODOT="$HOME/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          "$GODOT" --headless --editor --path alaska-explorer --quit

      - name: Verify survival systems
        run: |
          GODOT="$HOME/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          "$GODOT" --headless --path alaska-explorer --script res://tests/smoke.gd 2>&1 | tee /tmp/alaska-survival-smoke.log
          if grep -E "\[SMOKE FAIL\]|SCRIPT ERROR|Parse Error|Invalid call|Invalid access" /tmp/alaska-survival-smoke.log; then
            echo "Survival-system verification failed"
            exit 1
          fi

      - name: Runtime smoke test
        run: |
          GODOT="$HOME/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          set +e
          timeout 18s "$GODOT" --headless --path alaska-explorer --quit-after 240 2>&1 | tee /tmp/alaska-runtime.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if grep -E "SCRIPT ERROR|Invalid call|Invalid access|SHADER ERROR|Parse Error|Failed to load script|Cannot load resource|Failed loading resource" /tmp/alaska-runtime.log; then
            echo "Runtime smoke test found actionable Godot errors"
            exit 1
          fi
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 124 ]; then
            exit "$STATUS"
          fi

      - name: Export Android debug APK
        run: |
          GODOT="$HOME/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          mkdir -p alaska-explorer/build
          "$GODOT" --headless --path alaska-explorer --export-debug "Android" "$GITHUB_WORKSPACE/alaska-explorer/build/Alaska-Explorer-debug.apk"
          test -f alaska-explorer/build/Alaska-Explorer-debug.apk
          ls -lh alaska-explorer/build/Alaska-Explorer-debug.apk

      - name: Upload Alaska Explorer APK
        uses: actions/upload-artifact@v4
        with:
          name: Alaska-Explorer-v0.1-debug-apk
          path: alaska-explorer/build/Alaska-Explorer-debug.apk
          if-no-files-found: error
