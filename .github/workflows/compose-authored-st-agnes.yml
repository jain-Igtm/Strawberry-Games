name: Compose Authored St. Agnes Hospital

on:
  push:
    branches:
      - agent/st-agnes-playable-apk
    paths:
      - 'gravenmere/deadwater/scripts/compose-authored-st-agnes-lite.py'
      - 'gravenmere/deadwater/scripts/polish-authored-st-agnes.py'
      - 'gravenmere/deadwater/scripts/download-madduck-hospital.mjs'
      - '.github/workflows/compose-authored-st-agnes.yml'
  pull_request:
    branches:
      - agent/st-agnes-modular-hospital
    paths:
      - 'gravenmere/deadwater/scripts/compose-authored-st-agnes-lite.py'
      - 'gravenmere/deadwater/scripts/polish-authored-st-agnes.py'
      - 'gravenmere/deadwater/scripts/download-madduck-hospital.mjs'
      - '.github/workflows/compose-authored-st-agnes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-authored-st-agnes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: gravenmere/deadwater

    steps:
      - name: Check out isolated St. Agnes branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser downloader
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Download creator-provided authored hospital source
        run: node scripts/download-madduck-hospital.mjs authored-st-agnes-source/downloads

      - name: Install Blender and headless graphics libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            blender \
            python3-numpy \
            xvfb \
            libegl1 \
            libgl1 \
            libglx0 \
            libopengl0 \
            libgl1-mesa-dri

      - name: Extract authored source scene
        run: |
          mkdir -p authored-st-agnes-source/blend authored-st-agnes-lite-output authored-st-agnes-polished-output
          unzip -q 'authored-st-agnes-source/downloads/blend_file+textures.zip' -d authored-st-agnes-source/blend
          cp authored-st-agnes-source/downloads/SOURCE.txt authored-st-agnes-polished-output/SOURCE.txt
          BLEND_FILE="$(find authored-st-agnes-source/blend -type f -iname '*.blend' -print -quit)"
          test -n "$BLEND_FILE"
          printf '%s\n' "$BLEND_FILE" > authored-st-agnes-lite-output/blend-path.txt

      - name: Compose lightweight full-footprint hospital
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: |
          BLEND_FILE="$(cat authored-st-agnes-lite-output/blend-path.txt)"
          xvfb-run -a blender --background "$BLEND_FILE" \
            --python-exit-code 1 \
            --python scripts/compose-authored-st-agnes-lite.py \
            -- --output authored-st-agnes-lite-output

      - name: Polish ceilings and lighting, add signage, and batch for mobile
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: |
          xvfb-run -a blender --background --factory-startup \
            --python-exit-code 1 \
            --python scripts/polish-authored-st-agnes.py \
            -- \
            --input authored-st-agnes-lite-output/st-agnes-authored-lite.glb \
            --output authored-st-agnes-polished-output

      - name: Verify polished game scene and review images
        run: |
          test -s authored-st-agnes-polished-output/st-agnes-authored-polished.glb
          test -s authored-st-agnes-polished-output/st-agnes-authored-polished-stats.json
          test -s authored-st-agnes-polished-output/polished-lobby.png
          test -s authored-st-agnes-polished-output/polished-ward-a.png
          test -s authored-st-agnes-polished-output/polished-patient-room.png
          test -s authored-st-agnes-polished-output/polished-emergency.png
          python3 - <<'PY'
          import json
          from pathlib import Path
          stats = json.loads(Path('authored-st-agnes-polished-output/st-agnes-authored-polished-stats.json').read_text())
          assert stats['footprint']['width'] == 76
          assert stats['footprint']['depth'] == 46
          assert 0 < stats['objects_after_batching'] < stats['objects_before_batching']
          assert stats['objects_after_batching'] < 100
          assert stats['glb_bytes'] > 100000
          print(json.dumps(stats, indent=2))
          PY

      - name: Upload polished hospital review
        uses: actions/upload-artifact@v4
        with:
          name: Polished-Authored-St-Agnes
          path: |
            gravenmere/deadwater/authored-st-agnes-polished-output/st-agnes-authored-polished.glb
            gravenmere/deadwater/authored-st-agnes-polished-output/st-agnes-authored-polished-stats.json
            gravenmere/deadwater/authored-st-agnes-polished-output/SOURCE.txt
            gravenmere/deadwater/authored-st-agnes-polished-output/polished-lobby.png
            gravenmere/deadwater/authored-st-agnes-polished-output/polished-ward-a.png
            gravenmere/deadwater/authored-st-agnes-polished-output/polished-patient-room.png
            gravenmere/deadwater/authored-st-agnes-polished-output/polished-emergency.png
          if-no-files-found: error
          retention-days: 14
