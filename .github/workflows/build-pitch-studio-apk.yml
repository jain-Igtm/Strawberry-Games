name: Build Strawberry Pitch Studio APK

on:
  push:
    branches: [ main, agent/strawberry-pitch-studio ]
    paths:
      - 'pitch-studio-android/**'
      - '.github/workflows/build-pitch-studio-apk.yml'
  pull_request:
    paths:
      - 'pitch-studio-android/**'
      - '.github/workflows/build-pitch-studio-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Test and build debug APK
        working-directory: pitch-studio-android
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: strawberry-pitch-studio-debug-apk
          path: pitch-studio-android/app/build/outputs/apk/debug/app-debug.apk
